<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F1" />
      <stop offset="100%" stop-color="#E9E6DC" />
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424" />
      <stop offset="100%" stop-color="#1B1B1B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1A1814" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  
  <!-- Subtle Studio Grid -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#DFDBD0" stroke-width="1" />
  <line x1="60" y1="940" x2="740" y2="940" stroke="#DFDBD0" stroke-width="1" />

  <!-- Editorial Metadata -->
  <text x="70" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#8C887E">LOOPNI / COLLECTION 01</text>
  <text x="730" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#8C887E" text-anchor="end">FRONT VIEW</text>

  <!-- Product Silhouette Render Based on Type -->
  <g filter="url(#shadow)">
    
      <!-- Baseball Cap Silhouette -->
      <path d="M 230 460 Q 230 300 400 300 Q 570 300 570 460 Z" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
      <!-- Curved Visor Brim -->
      <path d="M 200 460 Q 400 450 600 460 Q 640 500 570 515 Q 400 495 230 515 Q 160 500 200 460 Z" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
      <!-- Button on top -->
      <circle cx="400" cy="298" r="10" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
      <!-- Embroidered Eyelets -->
      <circle cx="340" cy="380" r="4" fill="#555" />
      <circle cx="400" cy="370" r="4" fill="#555" />
      <circle cx="460" cy="380" r="4" fill="#555" />
    
  </g>

  <!-- Bottom Spec Tag -->
  <rect x="70" y="875" width="660" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#DFDBD0" stroke-width="1" />
  <text x="95" y="906" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#222222" letter-spacing="0.04em">Unstructured 6-panel washed canvas</text>
  <text x="705" y="906" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#777777" text-anchor="end">Antique Brass Slider</text>
</svg>