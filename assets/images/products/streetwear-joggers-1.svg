<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F5F1" />
      <stop offset="100%" stop-color="#E9E6DC" />
    </linearGradient>
    <linearGradient id="prodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2A2927" />
      <stop offset="100%" stop-color="#1E1D1B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1A1814" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  
  <!-- Subtle Studio Grid -->
  <line x1="60" y1="60" x2="740" y2="60" stroke="#DFDBD0" stroke-width="1" />
  <line x1="60" y1="940" x2="740" y2="940" stroke="#DFDBD0" stroke-width="1" />

  <!-- Editorial Metadata -->
  <text x="70" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="0.16em" fill="#8C887E">LOOPNI / COLLECTION 01</text>
  <text x="730" y="95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" letter-spacing="0.18em" fill="#8C887E" text-anchor="end">FRONT VIEW</text>

  <!-- Product Silhouette Render Based on Type -->
  <g filter="url(#shadow)">
    
      <!-- Pants / Cargos / Joggers Silhouette -->
      <path d="M 285 240 L 515 240 L 550 780 L 460 780 L 415 440 L 400 440 L 340 780 L 250 780 Z" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
      <!-- Waistband -->
      <rect x="285" y="240" width="230" height="36" fill="rgba(0,0,0,0.18)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      <!-- Cargo / Pocket Accents -->
      <rect x="260" y="450" width="55" height="90" rx="6" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      <rect x="485" y="450" width="55" height="90" rx="6" fill="url(#prodGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
      <!-- Ankle Cuffs -->
      <rect x="250" y="760" width="90" height="20" fill="rgba(0,0,0,0.25)" />
      <rect x="460" y="760" width="90" height="20" fill="rgba(0,0,0,0.25)" />
    
  </g>

  <!-- Bottom Spec Tag -->
  <rect x="70" y="875" width="660" height="50" rx="8" fill="#FFFFFF" fill-opacity="0.85" stroke="#DFDBD0" stroke-width="1" />
  <text x="95" y="906" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#222222" letter-spacing="0.04em">Concealed zip pockets & cuffs</text>
  <text x="705" y="906" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="500" fill="#777777" text-anchor="end">300 GSM French Terry</text>
</svg>